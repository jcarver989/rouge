[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
license-file = "LICENSE"
rust-version = "1.100"
repository = "https://github.com/jcarver989/rouge"
readme = "README.md"

[workspace.dependencies]
rouge-reactive = { path = "crates/rouge-reactive", version = "0.1.0" }
slotmap = "1"
rustc-hash = "2"
indexmap = "2"
tracing = "0.1"
rouge-render = { path = "crates/rouge-render", version = "0.1.0" }
rouge-core = { path = "crates/rouge-core", version = "0.1.0" }
rouge-macros = { path = "crates/rouge-macros", version = "0.1.0" }
wgpu = "30"
winit = "0.30"
taffy = { version = "0.15", default-features = false, features = ["std", "flexbox", "flexbox_balance", "grid", "block_layout", "float_layout", "calc", "content_size"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
web-time = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
zeno = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rouge-widgets = { path = "crates/rouge-widgets", version = "0.1.0" }
rouge-theme = { path = "crates/rouge-theme", version = "0.1.0" }
rouge-syntax = { path = "crates/rouge-syntax", version = "0.1.0" }
rouge-markdown = { path = "crates/rouge-markdown", version = "0.1.0" }
nucleo-matcher = "0.3"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"

[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
