[package]
name = "rouge-widgets"
description = "Rouge's component set: bundled fonts, rem-based tokens, typography, icons and widgets."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
markdown = ["syntax", "dep:rouge-markdown"]
syntax = ["dep:rouge-syntax"]

[dependencies]
rouge-core.workspace = true
rouge-markdown = { workspace = true, optional = true }
rouge-reactive.workspace = true
rouge-syntax = { workspace = true, optional = true }
rouge-theme.workspace = true

[dev-dependencies]
rouge-render.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rouge.workspace = true

[lints]
workspace = true
