[package]
name = "rouge-widgets"
description = "Rouge's component set: bundled fonts, rem-based tokens, typography, icons and widgets"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["gui", "ui", "widgets", "components", "icons"]
categories = ["gui"]

[package.metadata.docs.rs]
all-features = true

[features]
markdown = ["syntax", "dep:rouge-markdown"]
syntax = ["dep:rouge-syntax"]

[dependencies]
rouge-core.workspace = true
rouge-markdown = { workspace = true, optional = true }
rouge-reactive.workspace = true
rouge-syntax = { workspace = true, optional = true }
rouge-theme.workspace = true
nucleo-matcher.workspace = true

[dev-dependencies]
rouge-render.workspace = true
zeno.workspace = true

[lints]
workspace = true

[[test]]
name = "macros_component_test"
path = "tests/macros/component_test.rs"
