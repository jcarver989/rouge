[package]
name = "rouge-syntax"
description = "Tree-sitter syntax highlighting, symbol tags and syntax themes for Rouge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["tree-sitter", "syntax", "highlighting", "parser", "editor"]
categories = ["text-processing", "text-editors"]

[lints]
workspace = true

[features]
default = ["all-languages"]
all-languages = [
    "lang-asm",
    "lang-bash",
    "lang-batch",
    "lang-c",
    "lang-c-sharp",
    "lang-clojure",
    "lang-cmake",
    "lang-commonlisp",
    "lang-cpp",
    "lang-css",
    "lang-dart",
    "lang-diff",
    "lang-dockerfile",
    "lang-elixir",
    "lang-erlang",
    "lang-fish",
    "lang-go",
    "lang-graphql",
    "lang-haskell",
    "lang-hcl",
    "lang-html",
    "lang-ini",
    "lang-java",
    "lang-javascript",
    "lang-json",
    "lang-just",
    "lang-kotlin",
    "lang-lua",
    "lang-make",
    "lang-markdown",
    "lang-meson",
    "lang-ninja",
    "lang-nix",
    "lang-objc",
    "lang-ocaml",
    "lang-perl",
    "lang-php",
    "lang-powershell",
    "lang-proto",
    "lang-python",
    "lang-r",
    "lang-rego",
    "lang-ruby",
    "lang-rust",
    "lang-scala",
    "lang-scheme",
    "lang-scss",
    "lang-solidity",
    "lang-sql",
    "lang-starlark",
    "lang-svelte",
    "lang-swift",
    "lang-toml",
    "lang-tsx",
    "lang-typescript",
    "lang-vue",
    "lang-x86asm",
    "lang-xml",
    "lang-yaml",
    "lang-zig",
    "lang-zsh",
]

