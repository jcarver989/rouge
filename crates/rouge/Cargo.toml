[package]
name = "rouge"
description = "A signal-driven, GPU-composited UI framework for native apps and the web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["gui", "ui", "gpu", "reactive", "wgpu"]
categories = ["gui", "wasm"]

[package.metadata.docs.rs]
all-features = true

[features]
markdown = ["syntax", "rouge-widgets/markdown", "dep:rouge-markdown"]
open-url = ["dep:open"]
syntax = ["rouge-widgets/syntax", "dep:rouge-syntax"]
persist = ["dep:serde", "dep:serde_json"]
tokio-rt = ["rouge-reactive/tokio-rt", "tokio/macros", "tokio/rt", "tokio/time"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
rouge-reactive.workspace = true
rouge-render.workspace = true
rouge-core.workspace = true
wgpu.workspace = true
thiserror.workspace = true
tokio.workspace = true
rouge-widgets.workspace = true
rouge-markdown = { workspace = true, optional = true }
rouge-syntax = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit.workspace = true
pollster.workspace = true
tracing-chrome = "0.7"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
open = { version = "5", optional = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android")))'.dependencies]
arboard.workspace = true
image.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
winit = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIImage", "UIInterface", "UIPasteboard", "UIResponder", "UITraitCollection", "UIView"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions", "Clipboard", "ClipboardEvent", "CompositionEvent", "CssStyleDeclaration",
    "DataTransfer", "Document", "DomRect", "Element", "Event", "EventTarget", "HtmlCanvasElement",
    "HtmlElement", "HtmlTextAreaElement", "InputEvent", "KeyboardEvent", "Location", "MediaQueryList",
    "MediaQueryListEvent", "Navigator", "Performance", "PointerEvent", "ResizeObserver",
    "ResizeObserverBoxOptions", "ResizeObserverEntry", "ResizeObserverOptions", "ResizeObserverSize",
    "Storage", "UrlSearchParams", "WheelEvent", "Window", "console",
] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.3", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rouge = { path = ".", features = ["persist"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
winit.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
rouge = { path = ".", features = ["persist"] }
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "ClipboardEventInit", "DataTransfer", "History", "ImageData", "MouseEventInit", "PointerEventInit"] }

[[example]]
name = "android_todomvc"
crate-type = ["cdylib"]

[[test]]
name = "platform_web_test"
path = "tests/platform/web_test.rs"

[[test]]
name = "platform_web_host_test"
path = "tests/platform/web/host_test.rs"

[[test]]
name = "platform_web_host_webgl_test"
path = "tests/platform/web/host_webgl_test.rs"
