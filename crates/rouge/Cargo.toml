[package]
name = "rouge"
description = "A signal-driven, GPU-composited UI framework."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
open-url = ["dep:open"]
tokio-rt = ["rouge-reactive/tokio-rt"]

[dependencies]
open = { version = "5", optional = true }
rouge-reactive.workspace = true
rouge-render.workspace = true
rouge-core.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
thiserror.workspace = true
tokio.workspace = true
arboard.workspace = true
rouge-widgets.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.3", default-features = false }

[dev-dependencies]
clankerdiff-core = { git = "https://github.com/jcarver989/diff", rev = "09a11f7e7fbaa354a2df4743b4ee18ede000a30c" }
