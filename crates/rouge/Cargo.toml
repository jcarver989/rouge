[package]
name = "rouge"
description = "A signal-driven, GPU-composited UI framework."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
markdown = ["syntax", "rouge-widgets/markdown", "dep:rouge-markdown"]
open-url = ["dep:open"]
syntax = ["rouge-widgets/syntax", "dep:rouge-syntax"]
tokio-rt = [
    "rouge-reactive/tokio-rt",
    "dep:serde",
    "dep:serde_json",
    "tokio/macros",
    "tokio/rt",
    "tokio/time",
]

[dependencies]
open = { version = "5", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
rouge-reactive.workspace = true
rouge-render.workspace = true
rouge-core.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
thiserror.workspace = true
tokio.workspace = true
arboard.workspace = true
image.workspace = true
rouge-widgets.workspace = true
rouge-markdown = { workspace = true, optional = true }
rouge-syntax = { workspace = true, optional = true }
tracing.workspace = true
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.3", default-features = false }

[dev-dependencies]
rouge = { path = ".", features = ["tokio-rt"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
