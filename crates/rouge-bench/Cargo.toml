[package]
name = "rouge-bench"
description = "Headless benchmark scenarios for Rouge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["gui", "benchmark", "profiling", "wgpu", "ui"]
categories = ["development-tools::profiling"]
publish = false

[features]
profile = ["dep:backtrace", "dep:pprof"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
backtrace = { version = "0.3", optional = true }
clap = { version = "4", features = ["derive"] }
rouge = { path = "../rouge", features = ["markdown"] }
rustc-hash.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15", default-features = false, features = ["cpp"], optional = true }

[lints]
workspace = true
