[package]
name = "rouge-core"
description = "Element tree, styles, layout, text, views and the layer compositor for Rouge."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rouge-macros.workspace = true
rouge-reactive.workspace = true
rouge-render.workspace = true
rouge-theme.workspace = true
tracing.workspace = true
taffy.workspace = true
slotmap.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
zeno.workspace = true
image.workspace = true
swash = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parley = "0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
parley = { version = "0.12", default-features = false, features = ["std"] }
web-time.workspace = true

[dev-dependencies]
wgpu.workspace = true

[lints]
workspace = true

[[test]]
name = "compositor_actor_test"
path = "tests/compositor/actor_test.rs"

[[test]]
name = "compositor_thread_test"
path = "tests/compositor/thread_test.rs"

[[test]]
name = "compositor_layers_test"
path = "tests/compositor/layers_test.rs"

[[test]]
name = "tree_edit_test"
path = "tests/tree/edit_test.rs"

[[test]]
name = "tree_fragment_test"
path = "tests/tree/fragment_test.rs"
