[package]
name = "rouge-web"
description = "Browser host for the Rouge UI framework."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rouge-core.workspace = true
rouge-reactive.workspace = true
rouge-render.workspace = true

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
slotmap.workspace = true
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
wgpu.workspace = true
thiserror.workspace = true
web-time.workspace = true
web-sys = { version = "0.3", features = [
    "Clipboard", "ClipboardEvent", "CompositionEvent", "CssStyleDeclaration", "DataTransfer",
    "Document", "DomRect", "Event", "EventTarget", "HtmlCanvasElement", "HtmlElement",
    "HtmlTextAreaElement", "InputEvent", "KeyboardEvent", "MediaQueryList", "Navigator", "PointerEvent",
    "ResizeObserver", "WheelEvent", "Window", "console",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen-test = "0.3"
