[package]
name = "rouge-markdown"
description = "Renderer-neutral Markdown documents, append streams and syntax-highlighted code blocks for Rouge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["markdown", "commonmark", "gfm", "parser", "streaming"]
categories = ["text-processing", "parser-implementations"]

[lints]
workspace = true

[features]
default = ["all-languages"]
all-languages = ["rouge-syntax/all-languages"]

[dependencies]
linkify = "0.12.0"
pulldown-cmark = "0.13.0"
rouge-syntax = { workspace = true, default-features = false }
serde = { workspace = true, features = ["rc"] }
unicase = "2.10.0"
